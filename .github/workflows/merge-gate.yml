name: Merge Gate

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    name: Format Check
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
      - name: Ruff format check
        run: uvx ruff format --check .

  lint:
    name: Lint
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
      - name: Ruff lint
        run: uvx ruff check .

  typecheck:
    name: Type Check
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
      - name: Pyright
        run: uvx pyright

  build:
    name: Build
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
      - name: Build package
        run: uv build

  unit:
    name: Unit Tests
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
      - name: Install Python 3.12 via uv
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Tests with coverage gate
        run: uv run pytest --cov --cov-branch --cov-fail-under=90 --cov-report=xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  mutation:
    name: Mutation Tests
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
      - name: Install Python 3.12 via uv
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run mutation tests
        run: uv run mutmut run

  deadcode:
    name: Dead Code
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
      - name: Vulture dead code detection
        run: uvx vulture src/ --min-confidence 80

  deps:
    name: Dependency Audit
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  semgrep:
    name: Semgrep Security
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
      - name: Semgrep (direct CLI, no container)
        run: uvx --from 'semgrep==1.172.0' semgrep --config p/default --error src/

  sonarqube:
    name: SonarQube (local)
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    needs: [unit]
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: SonarQube Scan (local server)
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          command -v sonar-scanner >/dev/null || { echo "sonar-scanner is not installed on this runner"; exit 1; }
          curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" 'http://127.0.0.1:9001/api/components/show?component=mac-control-mcp' >/dev/null || { echo "local SonarQube server unreachable or auth failed"; exit 1; }
          sonar-scanner \
            -Dsonar.host.url=http://127.0.0.1:9001

  required-checks:
    name: Required Checks (Merge)
    if: always() && (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - format
      - lint
      - typecheck
      - build
      - unit
      - mutation
      - deadcode
      - deps
      - semgrep
      - sonarqube
    steps:
      - name: Verify all jobs passed
        run: |
          if [ "${{ needs.format.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.unit.result }}" != "success" ] || \
             [ "${{ needs.mutation.result }}" != "success" ] || \
             [ "${{ needs.deadcode.result }}" != "success" ] || \
             [ "${{ needs.deps.result }}" != "success" ] || \
             [ "${{ needs.semgrep.result }}" != "success" ] || \
             [ "${{ needs.sonarqube.result }}" != "success" ]; then
            echo "One or more merge gate jobs failed."
            exit 1
          fi
          echo "All merge gate jobs passed."
